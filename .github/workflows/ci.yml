name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y build-essential valgrind

      - name: Build
        run: make all build/gen_road build/bench_routing

      - name: Unit and CLI tests
        run: make test

      - name: Memory checks
        run: make valgrind
